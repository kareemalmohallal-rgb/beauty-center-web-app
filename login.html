<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth">

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>تسجيل الدخول 🔐</h2>

    <input type="email" id="loginEmail" placeholder="الإيميل">
    <input type="password" id="loginPassword" placeholder="كلمة المرور">

    <button class="btn" onclick="login()">دخول</button>

    <p onclick="showRegister()" style="cursor:pointer; margin-top:10px;">
      ما عندك حساب؟ إنشاء حساب
    </p>

    <div id="msg"></div>
  </div>

  <!-- REGISTER -->
  <div id="registerBox" style="display:none;">
    <h2>إنشاء حساب 🧾</h2>

    <input type="text" id="regName" placeholder="الاسم">
    <input type="email" id="regEmail" placeholder="الإيميل">
    <input type="password" id="regPassword" placeholder="كلمة المرور">

    <button class="btn" onclick="register()">إنشاء حساب</button>

    <p onclick="showLogin()" style="cursor:pointer; margin-top:10px;">
      لديك حساب؟ تسجيل دخول
    </p>

    <div id="msg2"></div>
  </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
